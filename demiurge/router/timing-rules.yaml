timing_rules:
  - id: sla-inbound-lead
    match:
      routing_tags: [lead, inbound]
      department_id: sales
    sla_reaction: PT2H
    escalate_to: human:ivan
    escalate_after: PT4H

  - id: sla-content-ready
    match:
      routing_tags: [content]
    sla_reaction: PT4H
    escalate_to: apollo-sales-lead
    escalate_after: PT8H

  - id: sla-pipeline-feedback
    match:
      routing_tags: [pipeline, win-loss]
    sla_reaction: PT24H
    escalate_to: hera-marketing-lead
    escalate_after: PT48H

  - id: sla-pd-insight
    match:
      routing_tags: [insight]
    sla_reaction: PT48H
    escalate_to: athena-product-discovery-lead
    escalate_after: P7D

  - id: sla-ops-agent-anomaly
    match:
      routing_tags: [eval-gate, drift, hard-stop]
      department_id: operations
    sla_reaction: PT1H
    escalate_to: human:ivan
    escalate_after: PT2H

  - id: sla-dept-health-breach
    match:
      routing_tags: [dept-health, kpi-breach]
      department_id: operations
    sla_reaction: PT4H
    escalate_to: human:ivan
    escalate_after: PT8H

  - id: sla-dept-activation
    match:
      routing_tags: [dept-activation]
      department_id: operations
    sla_reaction: PT24H
    escalate_to: kronos-operations-lead
    escalate_after: PT48H

  - id: sla-compliance-flag
    match:
      routing_tags: [compliance, trademark]
      department_id: operations
    sla_reaction: PT24H
    escalate_to: kronos-operations-lead
    escalate_after: P2D
