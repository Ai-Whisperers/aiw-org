dispatch_rules:
  - id: route-inbound-lead
    match:
      signal_type: cross_dept
      routing_tags: [lead, inbound]
    deliver_to:
      - type: agent
        id: apollo-sales-lead
      - type: agent
        id: cadmus-lead-enrichment
    fan_out: all

  - id: route-content-ready
    match:
      routing_tags: [content, pipeline]
    deliver_to:
      - type: agent
        id: apollo-sales-lead
    fan_out: first_available

  - id: route-pd-insight
    match:
      routing_tags: [insight, validation]
    deliver_to:
      - type: agent
        id: hera-marketing-lead
      - type: agent
        id: apollo-sales-lead
    fan_out: all

  - id: route-pipeline-feedback
    match:
      routing_tags: [pipeline, win-loss]
    deliver_to:
      - type: agent
        id: hera-marketing-lead
      - type: agent
        id: athena-product-discovery-lead
    fan_out: all

  - id: route-customer-signal
    match:
      routing_tags: [customer-voice]
    deliver_to:
      - type: agent
        id: clio-customer-signal-collector
    fan_out: first_available

  - id: route-dept-activation
    match:
      routing_tags: [dept-activation]
    deliver_to:
      - type: agent
        id: kronos-operations-lead
    fan_out: first_available

  - id: route-dept-health-breach
    match:
      routing_tags: [dept-health, kpi-breach]
    deliver_to:
      - type: agent
        id: kronos-operations-lead
    fan_out: first_available

  - id: route-ops-agent-anomaly
    match:
      routing_tags: [eval-gate, drift, hard-stop]
    deliver_to:
      - type: agent
        id: kronos-operations-lead
    fan_out: first_available

  - id: route-compliance-flag
    match:
      routing_tags: [compliance, trademark]
    deliver_to:
      - type: agent
        id: kronos-operations-lead
    fan_out: first_available

  # Phase 3 of AIW upgrade plan: two-phase build pipeline
  # See /opt/data/agents/docs/patterns/architect-then-builder.md
  # and /opt/data/agents/docs/patterns/auditor-agent.md
  # NB: rules use single-tag-match so signal doesn't need all tags.

  - id: route-architect-task
    match:
      routing_tags: [architect]
    deliver_to:
      - type: agent
        id: architect-agent
    fan_out: first_available

  - id: route-auditor-task
    match:
      routing_tags: [audit]
    deliver_to:
      - type: agent
        id: auditor-agent
    fan_out: first_available

  - id: route-builder-task
    match:
      routing_tags: [implement]
    deliver_to:
      - type: agent
        id: builder-agent
    fan_out: first_available

  - id: route-verify-impl-task
    match:
      routing_tags: [verify-impl]
    deliver_to:
      - type: agent
        id: auditor-agent
    fan_out: first_available

  # Two-phase build pipeline:
  #   spec [architect] → review [audit] → implement [implement] → verify [verify-impl]
