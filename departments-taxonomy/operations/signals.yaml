# Operations signal definitions
# DEMIURGE-075 — sourced from sources/operations/catalog.yaml
# Sender convention: internal KPIs use producing agent id; cross_dept uses Tier 2 department id (e.g. ai-ops, compliance).

signal_types:
  # --- Daily KPIs ---
  - id: ops-incident-open-count
    direction: internal
    type: kpi
    sender: ai-ops-coordinator
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P1D
    routing_tags: [incident, daily]

  - id: ops-agent-health-anomaly
    direction: in
    type: cross_dept
    sender: ai-ops
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [eval-gate, drift, hard-stop]
    sla_reaction: PT1H

  - id: ops-stale-repo-count
    direction: internal
    type: kpi
    sender: management-coordinator
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P1D
    routing_tags: [repo-health, daily]

  - id: ops-cron-error-count
    direction: internal
    type: kpi
    sender: business-analyst
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P1D
    routing_tags: [cron, daily]

  - id: ops-decision-queue-depth
    direction: internal
    type: kpi
    sender: management-coordinator
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P1D
    routing_tags: [decision-queue, daily]
    quorum_required: quorum-ops-decision-queue

  # --- Weekly KPIs ---
  - id: ops-okr-completion-pct
    direction: internal
    type: kpi
    sender: bizops-tracker
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P7D
    routing_tags: [okr, weekly]

  - id: ops-cycle-time-days
    direction: internal
    type: kpi
    sender: management-coordinator
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P7D
    routing_tags: [cycle-time, weekly]

  - id: ops-vendor-renewal-30d
    direction: internal
    type: kpi
    sender: bizops-tracker
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P7D
    routing_tags: [vendor, renewal, weekly]

  - id: ops-cross-dept-blocker-count
    direction: internal
    type: kpi
    sender: bizops-tracker
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P7D
    routing_tags: [blocker, weekly]

  - id: ops-compliance-flag-count
    direction: in
    type: cross_dept
    sender: compliance
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [compliance, trademark]
    sla_reaction: PT24H

  - id: ops-decision-latency-days
    direction: internal
    type: kpi
    sender: bizops-tracker
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P7D
    routing_tags: [decision-latency, weekly]

  # --- Monthly / quarterly KPIs ---
  - id: ops-burn-rate
    direction: internal
    type: kpi
    sender: bizops-tracker
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P30D
    routing_tags: [cost, monthly]

  - id: ops-cost-per-transaction
    direction: internal
    type: kpi
    sender: bizops-tracker
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P30D
    routing_tags: [unit-economics, monthly]

  - id: ops-tool-sprawl-count
    direction: internal
    type: kpi
    sender: bizops-tracker
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P90D
    routing_tags: [vendor, quarterly]

  - id: ops-okr-reset
    direction: internal
    type: kpi
    sender: bizops-tracker
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    measurement_cadence: P90D
    routing_tags: [okr, quarterly]

  # --- Cross-dept (ai-org-platform) ---
  - id: dept-activation-ready
    direction: in
    type: cross_dept
    sender: ai-org-platform
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [dept-activation]
    sla_reaction: PT24H

  - id: dept-health-breach
    direction: in
    type: cross_dept
    sender: ai-org-platform
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [dept-health, kpi-breach]
    sla_reaction: PT4H
    quorum_required: quorum-ops-health-breach

  - id: dept-kpi-signals
    direction: out
    type: cross_dept
    recipients: [ai-org-platform]
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [kpi, rollup]
    sla_reaction: PT48H

  - id: org-new-dept-request
    direction: out
    type: cross_dept
    recipients: [ai-org-platform]
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [dept-request]
    sla_reaction: PT24H

quorum_definitions:
  - id: quorum-ops-decision-queue
    required_count: 1
    required_agents: [management-coordinator]
    time_window: P1D
    fallback: escalate
    fallback_target: human:ivan

  - id: quorum-ops-health-breach
    required_count: 1
    required_agents: [bizops-tracker]
    time_window: PT4H
    fallback: escalate
    fallback_target: human:ivan
