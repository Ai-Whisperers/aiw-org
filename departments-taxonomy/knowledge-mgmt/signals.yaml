# Knowledge Management signal definitions

signal_types:
  - id: document-ingest
    direction: in
    type: org_broadcast
    sender: org-wide
    routing_tags: [document-ingest]
    sla_reaction: PT1H
    subscribers:
      - themis-document-classifier

  - id: transcript-ready
    direction: in
    type: dept
    sender: orpheus-recordings-agent
    routing_tags: [transcript-ready, document-ingest]
    sla_reaction: PT1H
    subscribers:
      - themis-document-classifier

  - id: document-classified
    direction: internal
    type: dept
    sender: themis-document-classifier
    routing_tags: [document-classified]
    payload_schema:
      required: [envelope_id, document_type, derived_urgency, routing_tags]
    subscribers:
      - mnemosyne-document-archivist
      - hephaestus-document-miner
      - peitho-language-quality

  - id: quality-assessed
    direction: internal
    type: dept
    sender: peitho-language-quality
    routing_tags: [quality-assessed]
    payload_schema:
      required: [envelope_id, document_type, derived_urgency, routing_tags, gate_triggered]
    subscribers:
      - pheme-document-router

  - id: quality-gate-cleared
    direction: in
    type: direct
    sender: human
    routing_tags: [quality-gate-cleared]
    subscribers:
      - pheme-document-router

  - id: recording-upload
    direction: in
    type: cross_dept
    sender: human
    routing_tags: [recording-upload]
    sla_reaction: PT4H
    subscribers:
      - orpheus-recordings-agent

  - id: terminology-update
    direction: in
    type: cross_dept
    sender: hephaestus-document-miner
    routing_tags: [terminology, demiurge-077]
    sla_reaction: PT24H

  - id: document-routed
    direction: out
    type: cross_dept
    sender: pheme-document-router
    priority: per derived.urgency
    routing_tags: [document-routed]

  - id: action-item-extracted
    direction: out
    type: cross_dept
    sender: hephaestus-document-miner
    routing_tags: [action-item]
    sla_reaction: PT24H

  - id: decision-logged
    direction: out
    type: cross_dept
    sender: hephaestus-document-miner
    routing_tags: [decision]
    sla_reaction: PT24H

  - id: nugget-surfaced
    direction: out
    type: cross_dept
    sender: hephaestus-document-miner
    routing_tags: [nugget]
    sla_reaction: PT48H

  - id: quality-report
    direction: out
    type: direct
    sender: peitho-language-quality
    routing_tags: [quality]
    sla_reaction: PT72H

  - id: citation-extracted
    direction: internal
    type: dept
    sender: hephaestus-document-miner
    routing_tags: [citation, literature]
    sla_reaction: PT48H
    payload_schema:
      required: [document_id, citation_ref]
    subscribers:
      - thoth-literature-scanner
