signal_types:
  - id: product-discovery-insight
    direction: out
    type: cross_dept
    recipients: [marketing, sales]
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [insight, validation]
    quorum_required: quorum-pd-insight-review

  - id: marketing-campaign-brief
    direction: in
    type: cross_dept
    sender: marketing
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [campaign, brief]

  - id: sales-pipeline-feedback
    direction: in
    type: cross_dept
    sender: sales
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [pipeline, win-loss]

  - id: customer-signal-raw
    direction: internal
    type: direct
    sender: clio-customer-signal-collector
    recipients: [athena-product-discovery-lead]
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [customer-voice]

quorum_definitions:
  - id: quorum-pd-insight-review
    required_count: 2
    required_agents: [athena-product-discovery-lead, hera-marketing-lead]
    time_window: PT48H
    fallback: auto_resolve
    on_met: trigger_next_workflow
