signal_types:
  - id: sales-inbound-lead
    direction: in
    type: cross_dept
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [lead, inbound]
    sla_reaction: PT2H
    quorum_required: quorum-sales-lead-ack

  - id: sales-pipeline-feedback
    direction: out
    type: cross_dept
    recipients: [marketing]
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [pipeline, win-loss]

  - id: sales-discovery-complete
    direction: out
    type: direct
    recipients: [metis-proposal-drafter]
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [proposal, discovery]

  - id: marketing-content-ready
    direction: in
    type: cross_dept
    sender: marketing
    priority: normal  # pending DEMIURGE-077 P0-P3 review
    routing_tags: [content, pipeline]

quorum_definitions:
  - id: quorum-sales-lead-ack
    required_count: 1
    required_agents: [apollo-sales-lead]
    time_window: PT2H
    fallback: escalate
    fallback_target: human:ivan
