## Key insights (extracted)

1. **Given vs derived attributes** — creator intent vs classifier inference; always carry confidence on derived fields
2. **routing_tags mirror audience** — dept/agent ids in `derived.audience` must appear in `routing_tags` for dispatch rules to match
3. **Quality before route** — Peitho emits `quality-assessed`; Pheme routes only after assessment completes

