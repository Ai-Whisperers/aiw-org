## Key insights (extracted)

1. **Channel-market fit before scale** — Traction bullseye: one channel until it works
2. **JTBD framing** — market problems, not product features
3. **Inbound + consent** — align with AI Whisperers coaching ethics
4. **Founder-led content** — high trust for SMB ICP
5. **Measure leading indicators** — engagement before revenue attribution

