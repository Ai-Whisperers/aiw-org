## Science-backed frameworks (≥3)

| framework | source | domain |
|-----------|--------|--------|
| OKRs | Measure What Matters (Doerr) | goal-setting, quarterly alignment |
| Managerial leverage / output | High Output Management (Grove) | signal-driven daily ops, decision latency |
| DORA metrics (MTTR, change failure rate, deployment frequency) | DORA State of DevOps | incident response, engineering ops |
| Theory of Constraints | The Goal (Goldratt) | process bottlenecks, cycle time |
| ITIL incident + change management | ITIL 4 | runbook culture, service ops |

## Key insights

1. **Signal over meetings** — Grove: managerial output = output of org; measure leading indicators daily, not status meetings
2. **OKRs with kill criteria** — Doerr: objectives qualitative, key results measurable; weekly check-ins, quarterly reset
3. **Incident culture** — ITIL + DORA: blameless postmortems, MTTR as primary health signal, runbooks before heroics
4. **Vendor stack hygiene** — First Round / a16z: SaaS renewal calendar, cost-per-seat tracking, tool sprawl audits quarterly
5. **Cross-dept coordination without middle management** — async briefs + explicit decision queues (Ivan ≤3 decisions/week)
6. **Unit economics** — burn rate, cost per transaction, infra cost per agent run; weekly snapshot not monthly surprise
7. **Process as code** — documented procedures in repo, not tribal knowledge; Atlassian playbooks for retros, health monitors

