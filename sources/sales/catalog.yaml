## Key insights

1. **Inbound-first** (D2 decision) — qualify before outbound
2. **Discovery before demo** — SPIN / MEDDIC for coaching ICP
3. **Pipeline hygiene** — stage definitions, exit criteria
4. **RevOps feedback loop** — win/loss → marketing
5. **Human-in-loop** for proposals and discounts (hard stops)

