name: AIW CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml croniter

      # PR1 (DEMIURGE-099): Hermetic AIW_ROOT fixture.
      # ~20 test modules hardcode Path('/opt/data/...') at module-import
      # time. The GH Actions runner has no /opt/data, so the tests fail
      # with FileNotFoundError. We populate /opt/data/state, /opt/data/agents,
      # /opt/data/.hermes/cron, and /opt/data/.venv with empty fixtures so
      # those Path() calls resolve. On a real production host where /opt/data
      # already exists, tests/conftest.py detects this and is a no-op.
      - name: Setup hermetic AIW_ROOT fixture
        env:
          HERMETIC_AIW_ROOT: /tmp/aiw-fixture
        run: |
          mkdir -p /tmp/aiw-fixture/state
          mkdir -p /tmp/aiw-fixture/agents/scripts
          mkdir -p /tmp/aiw-fixture/agents/demiurge/agents
          mkdir -p /tmp/aiw-fixture/.hermes/cron
          mkdir -p /tmp/aiw-fixture/.venv/bin
          touch /tmp/aiw-fixture/.venv/bin/python3
          echo '{"jobs": []}' > /tmp/aiw-fixture/.hermes/cron/jobs.json
          # Export so subsequent steps (and pytest) inherit HERMETIC_AIW_ROOT.
          # tests/conftest.py reads it to populate /opt/data/ when empty.
          echo "HERMETIC_AIW_ROOT=/tmp/aiw-fixture" >> "$GITHUB_ENV"
          # conftest.py auto-populates /opt/data from the fixture if /opt/data
          # is empty. We don't pre-populate here because conftest is the
          # single source of truth for the setup shape.

      - name: Run lint (PROMPT frontmatter + structure)
        run: |
          python scripts/lint-prompts.py

      - name: Run pytest (fast tests, default excludes @slow)
        run: |
          # Per R1 (Phase Kernel brief): tests must run, not skip.
          # Default `pytest -m 'not slow'` excludes slow tests (e.g.
          # the >120s smoke-test.sh wrapper) from the default suite.
          # Conditional pytest.skip() in test bodies (for missing
          # preconditions) is allowed; bare @unittest.skip /
          # @pytest.mark.skip DECORATORS are not.
          #
          # HERMETIC_AIW_ROOT comes from $GITHUB_ENV (set by the
          # "Setup hermetic AIW_ROOT fixture" step above).
          python -m pytest tests/ -v --tb=short -m 'not slow'

      - name: R1 gate - any @skip decorator fails the build
        run: |
          # Per R1: skip DECORATORS are forbidden. Conditional
          # pytest.skip() in test bodies for missing preconditions is OK.
          if grep -rnE '@(unittest|pytest)\.skip|@(unittest|pytest)\.skipIf' tests/ --include='*.py'; then
            echo "::error::R1 violation: tests/ has @skip decorator usage. R1: tests must run, not skip."
            exit 1
          fi

      - name: readme-counts --check (DEMIURGE-096)
        run: |
          # DEMIURGE-096: README claims must match measured values.
          # Wired into CI so drift fails the build.
          python scripts/readme-counts.py --check

      - name: Body-preservation gate (PROMPT.md files >= 20 lines)
        run: |
          # PR1: was `|| true` (swallowed failures). Now fail loud so
          # PROMPT-body regressions block the build.
          python scripts/restore-prompt-bodies.py --verify

      - name: (Optional) Slow tests - run on schedule/manual dispatch
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-slow]')
        run: |
          python -m pytest tests/ -v --tb=short -m slow
