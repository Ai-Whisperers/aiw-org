name: AIW CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml croniter

      # PR1 (DEMIURGE-099): Hermetic AIW_ROOT fixture.
      # ~20 test modules hardcode Path('/opt/data/...') at module-import
      # time AND run subprocess commands against paths like
      # /opt/data/agents/scripts/X.py. Solution: populate the various
      # /opt/data/* subdirs as symlinks to either the repo (for code)
      # or empty fixtures (for state).
      - name: Setup hermetic AIW_ROOT fixture
        run: |
          REPO="$GITHUB_WORKSPACE"
          # /opt/data doesn't exist on GH Actions Ubuntu runners. Create it.
          mkdir -p /opt/data
          # /opt/data/agents -> REPO (so /opt/data/agents/scripts/X.py works)
          ln -sfn "$REPO" /opt/data/agents
          echo "Linked /opt/data/agents -> $REPO"
          # /opt/data/.venv/bin/python3 -> real python (some tests subprocess-run this)
          mkdir -p /opt/data/.venv/bin
          ln -sf "$(which python)" /opt/data/.venv/bin/python3
          # /opt/data/.hermes/cron/jobs.json -> realistic 168-job fixture
          # (matches README claim; required for readme-counts.py --check).
          mkdir -p /opt/data/.hermes/cron
          cp "$REPO/tests/fixtures/cron-jobs-168.json" /opt/data/.hermes/cron/jobs.json
          # /opt/data/state -> empty dir (tests check for files here)
          mkdir -p /opt/data/state
          # /opt/data/scripts -> REPO/scripts (some tests reference this)
          ln -sfn "$REPO/scripts" /opt/data/scripts
          echo "Linked /opt/data/scripts -> $REPO/scripts"
          # /opt/data/agents-v2/aiw-org-clone/scripts -> REPO/scripts
          # (some restore-prompt-bodies tests look here)
          mkdir -p /opt/data/agents-v2/aiw-org-clone
          ln -sfn "$REPO/scripts" /opt/data/agents-v2/aiw-org-clone/scripts
          echo "Linked /opt/data/agents-v2/aiw-org-clone/scripts -> $REPO/scripts"
          ls -la /opt/data

      - name: Run lint (PROMPT frontmatter + structure)
        run: |
          python scripts/lint-prompts.py

      - name: Run pytest (fast tests, default excludes @slow)
        run: |
          # Per R1 (Phase Kernel brief): tests must run, not skip.
          # Default `pytest -m 'not slow'` excludes slow tests (e.g.
          # the >120s smoke-test.sh wrapper) from the default suite.
          # Conditional pytest.skip() in test bodies (for missing
          # preconditions) is allowed; bare @unittest.skip /
          # @pytest.mark.skip DECORATORS are not.
          #
          # HERMETIC_AIW_ROOT comes from $GITHUB_ENV (set by the
          # "Setup hermetic AIW_ROOT fixture" step above).
          python -m pytest tests/ -v --tb=short -m 'not slow'

      - name: R1 gate - any @skip decorator fails the build
        run: |
          # Per R1: skip DECORATORS are forbidden. Conditional
          # pytest.skip() in test bodies for missing preconditions is OK.
          #
          # Match lines that LOOK LIKE decorators: optional whitespace,
          # then @pytest.skip or @unittest.skip, followed by whitespace
          # + paren or end-of-line. Docstring/comment references do not
          # match this pattern.
          if grep -rnE '^\s*@(pytest|unittest)\.skip(\s*$|\s*\()' tests/ --include='*.py'; then
            echo "::error::R1 violation: tests/ has @skip decorator usage. R1: tests must run, not skip."
            exit 1
          fi

      - name: readme-counts --check (DEMIURGE-096)
        run: |
          # DEMIURGE-096: README claims must match measured values.
          # Wired into CI so drift fails the build.
          python scripts/readme-counts.py --check

      - name: Body-preservation gate (PROMPT.md files >= 20 lines)
        run: |
          # PR1: was `|| true` (swallowed failures). Now fail loud so
          # PROMPT-body regressions block the build.
          python scripts/restore-prompt-bodies.py --verify

      - name: (Optional) Slow tests - run on schedule/manual dispatch
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-slow]')
        run: |
          python -m pytest tests/ -v --tb=short -m slow
